# Desenvolvimento local. Valores SOMENTE para dev; nunca reutilize em outro ambiente.
app:
  security:
    require-https: false
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:3000

spring:
  datasource:
    # H2 em modo PostgreSQL: as mesmas migrations rodam aqui e no Postgres de produção.
    url: jdbc:h2:mem:luthieria;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    health:
      show-details: always

# O bind de parâmetros imprime e-mails e hashes no log: útil para depurar, proibido em produção (LGPD).
logging:
  level:
    org.hibernate.SQL: debug

luthieria:
  frontend-url: http://localhost:3000
  # Sem a API do WhatsApp em dev: o código de acesso do cliente aparece no log
  whatsapp:
    log-codes: true
  admin:
    senha: ${ADMIN_SENHA:dev-admin-12345}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-min-32-bytes!!}
