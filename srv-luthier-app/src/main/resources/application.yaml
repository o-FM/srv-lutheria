# Configuração BASE: padrões seguros, valem para todos os ambientes.
# Relaxamentos de desenvolvimento ficam em application-dev.yaml (perfil padrão local).
spring:
  application:
    name: srv-luthieria
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade do Flyway; o Hibernate só confere se bate com as entidades.
      ddl-auto: validate
  flyway:
    enabled: true
    # Cada módulo traz suas migrations em db/migration/<modulo> dentro do próprio JAR.
    locations: classpath:db/migration
  modulith:
    events:
      # Eventos concluídos saem do outbox; os que falharam ficam para reprocessamento.
      completion-mode: delete
      republish-outstanding-events-on-restart: true

app:
  security:
    require-https: true
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.luthieria.com.br}

luthieria:
  jwt:
    expiracao-minutos: 15
    secret: ${JWT_SECRET}
  admin:
    email: ${ADMIN_EMAIL:admin@luthieria.local}
    senha: ${ADMIN_SENHA}
  frontend-url: ${FRONTEND_URL:https://app.luthieria.com.br}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  observations:
    key-values:
      application: srv-luthieria
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
