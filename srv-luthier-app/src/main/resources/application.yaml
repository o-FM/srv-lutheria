app:
  security:
    require-https: false
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:3000

spring:
  # Sem migrations por enquanto (decisão do time): o Hibernate gera o schema.
  # Ao adotar Flyway, trocar para "validate" e habilitar o flyway.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
  # MOVIDO do application.yaml: console do H2 só em dev
  h2:
    console:
      enabled: true
      path: /h2-console

# MOVIDO do application.yaml: o bind de parâmetros imprime e-mails, hashes de senha e hashes de
# token no log. Útil para depurar, proibido em produção (LGPD).
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# Valores SOMENTE para desenvolvimento local. Nunca reutilize em outro ambiente.
luthieria:
  admin:
    senha: ${ADMIN_SENHA:dev-admin-12345}
  jwt:
    expiracao-minutos: 15
    secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-min-32-bytes!!}