name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compila, roda testes unitários e de integração (H2 + PostgreSQL via Testcontainers),
      # e a verificação de fronteiras do Spring Modulith (ModularityTest).
      - name: Build e testes
        run: mvn -B -ntp verify

      - name: Documentação dos módulos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modulith-docs
          path: srv-luthier-app/target/spring-modulith-docs
          if-no-files-found: ignore

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports"

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Varredura de vulnerabilidades em dependências e no Dockerfile (falha em HIGH/CRITICAL).
      - name: Trivy (dependências)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
